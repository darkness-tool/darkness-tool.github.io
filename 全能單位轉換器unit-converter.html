    <script>
        // Initialize icons
        lucide.createIcons();
        
        // Conversion data
        const conversions = {
            length: {
                name: '長度',
                units: {
                    'm': { name: '公尺', factor: 1 },
                    'km': { name: '公里', factor: 1000 },
                    'cm': { name: '厘米', factor: 0.01 },
                    'mm': { name: '毫米', factor: 0.001 },
                    'mi': { name: '英哩', factor: 1609.344 },
                    'yd': { name: '碼', factor: 0.9144 },
                    'ft': { name: '英呎', factor: 0.3048 },
                    'in': { name: '英吋', factor: 0.0254 },
                    'nm': { name: '海里', factor: 1852 }
                }
            },
            weight: {
                name: '重量',
                units: {
                    'kg': { name: '公斤', factor: 1 },
                    'g': { name: '克', factor: 0.001 },
                    'mg': { name: '毫克', factor: 0.000001 },
                    'lb': { name: '磅', factor: 0.453592 },
                    'oz': { name: '盎司', factor: 0.0283495 },
                    't': { name: '公噸', factor: 1000 },
                    'st': { name: '石', factor: 6.35029 },
                    'ct': { name: '克拉', factor: 0.0002 }
                }
            },
            temperature: {
                name: '溫度',
                type: 'temperature',
                units: {
                    'c': { name: '攝氏 (°C)' },
                    'f': { name: '華氏 (°F)' },
                    'k': { name: '開爾文 (K)' }
                },
                convert: (value, from, to) => {
                    let celsius;
                    // Convert to Celsius first
                    if (from === 'c') celsius = value;
                    else if (from === 'f') celsius = (value - 32) * 5 / 9;
                    else if (from === 'k') celsius = value - 273.15;
                    
                    // Convert from Celsius to target
                    if (to === 'c') return celsius;
                    else if (to === 'f') return celsius * 9 / 5 + 32;
                    else if (to === 'k') return celsius + 273.15;
                },
                getFormula: (from, to) => {
                    const formulas = {
                        'c-f': '°F = °C × 9/5 + 32',
                        'f-c': '°C = (°F - 32) × 5/9',
                        'c-k': 'K = °C + 273.15',
                        'k-c': '°C = K - 273.15',
                        'f-k': 'K = (°F - 32) × 5/9 + 273.15',
                        'k-f': '°F = (K - 273.15) × 9/5 + 32'
                    };
                    const key = `${from}-${to}`;
                    return formulas[key] || '數值轉換';
                }
            },
            area: {
                name: '面積',
                units: {
                    'sqm': { name: '平方米 (m²)', factor: 1 },
                    'sqkm': { name: '平方公里 (km²)', factor: 1000000 },
                    'sqft': { name: '平方英呎 (ft²)', factor: 0.092903 },
                    'sqyd': { name: '平方碼 (yd²)', factor: 0.836127 },
                    'acre': { name: '英畝', factor: 4046.86 },
                    'ha': { name: '公頃', factor: 10000 },
                    'sqin': { name: '平方英吋 (in²)', factor: 0.00064516 },
                    'sqmi': { name: '平方英哩 (mi²)', factor: 2589988 }
                }
            },
            volume: {
                name: '體積',
                units: {
                    'l': { name: '公升 (L)', factor: 1 },
                    'ml': { name: '毫升 (mL)', factor: 0.001 },
                    'gal': { name: '美制加侖', factor: 3.78541 },
                    'qt': { name: '美制夸脫', factor: 0.946353 },
                    'pt': { name: '美制品脫', factor: 0.473176 },
                    'floz': { name: '美制液盎司', factor: 0.0295735 },
                    'cbm': { name: '立方米 (m³)', factor: 1000 },
                    'cuft': { name: '立方英呎 (ft³)', factor: 28.3168 }
                }
            },
            time: {
                name: '時間',
                units: {
                    's': { name: '秒', factor: 1 },
                    'ms': { name: '毫秒', factor: 0.001 },
                    'min': { name: '分', factor: 60 },
                    'h': { name: '小時', factor: 3600 },
                    'd': { name: '天', factor: 86400 },
                    'w': { name: '週', factor: 604800 },
                    'mo': { name: '月 (30天)', factor: 2592000 },
                    'y': { name: '年 (365天)', factor: 31536000 }
                }
            },
            data: {
                name: '數據',
                units: {
                    'b': { name: '位元', factor: 0.125 },
                    'B': { name: '位元組', factor: 1 },
                    'KB': { name: 'KB', factor: 1024 },
                    'MB': { name: 'MB', factor: 1048576 },
                    'GB': { name: 'GB', factor: 1073741824 },
                    'TB': { name: 'TB', factor: 1099511627776 },
                    'PB': { name: 'PB', factor: 1125899906842624 },
                    'EB': { name: 'EB', factor: 1152921504606847000 }
                }
            },
            speed: {
                name: '速度',
                units: {
                    'mps': { name: '公尺/秒 (m/s)', factor: 1 },
                    'kph': { name: '公里/時 (km/h)', factor: 0.277778 },
                    'mph': { name: '英哩/時 (mph)', factor: 0.44704 },
                    'kn': { name: '節', factor: 0.514444 },
                    'fps': { name: '英呎/秒 (ft/s)', factor: 0.3048 },
                    'mach': { name: '馬赫', factor: 343 }
                }
            }
        };
        
        // DOM Elements
        const fromValue = document.getElementById('fromValue');
        const toValue = document.getElementById('toValue');
        const fromUnit = document.getElementById('fromUnit');
        const toUnit = document.getElementById('toUnit');
        const swapBtn = document.getElementById('swapBtn');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const categoryTitle = document.getElementById('categoryTitle');
        const formulaToggle = document.getElementById('formulaToggle');
        const formulaText = document.getElementById('formulaText');
        const formulaIcon = document.getElementById('formulaIcon');
        const copyBtn = document.getElementById('copyBtn');
        const favoriteBtn = document.getElementById('favoriteBtn');
        const clearBtn = document.getElementById('clearBtn');
        const favoritesList = document.getElementById('favoritesList');
        const historyList = document.getElementById('historyList');
        const clearFavorites = document.getElementById('clearFavorites');
        const clearHistory = document.getElementById('clearHistory');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // State
        let currentCategory = 'length';
        let conversionHistory = JSON.parse(localStorage.getItem('unitConverterHistory')) || [];
        let favorites = JSON.parse(localStorage.getItem('unitConverterFavorites')) || [];
        
        // Load saved theme
        const savedTheme = localStorage.getItem('unitConverterTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Populate unit dropdowns
        function populateUnits(category) {
            const units = conversions[category].units;
            fromUnit.innerHTML = '';
            toUnit.innerHTML = '';
            
            const unitKeys = Object.keys(units);
            unitKeys.forEach((key, index) => {
                const option1 = new Option(units[key].name, key);
                const option2 = new Option(units[key].name, key);
                fromUnit.add(option1);
                toUnit.add(option2);
            });
            
            // Set default selections (different units)
            fromUnit.selectedIndex = 0;
            toUnit.selectedIndex = Math.min(1, unitKeys.length - 1);
            
            updateFormula();
        }
        
        // Convert value
        function convert(direction) {
            const category = conversions[currentCategory];
            let result;
            
            if (category.type === 'temperature') {
                if (direction === 'from') {
                    result = category.convert(parseFloat(fromValue.value), fromUnit.value, toUnit.value);
                    toValue.value = isNaN(result) ? '' : formatNumber(result);
                } else {
                    result = category.convert(parseFloat(toValue.value), toUnit.value, fromUnit.value);
                    fromValue.value = isNaN(result) ? '' : formatNumber(result);
                }
            } else {
                if (direction === 'from') {
                    const fromFactor = category.units[fromUnit.value].factor;
                    const toFactor = category.units[toUnit.value].factor;
                    result = (parseFloat(fromValue.value) * fromFactor) / toFactor;
                    toValue.value = isNaN(result) ? '' : formatNumber(result);
                } else {
                    const fromFactor = category.units[fromUnit.value].factor;
                    const toFactor = category.units[toUnit.value].factor;
                    result = (parseFloat(toValue.value) * toFactor) / fromFactor;
                    fromValue.value = isNaN(result) ? '' : formatNumber(result);
                }
            }
            
            // Add to history if value is valid
            if (fromValue.value && toValue.value) {
                addToHistory();
            }
            
            updateFormula();
        }
        
        // Format number
        function formatNumber(num) {
            if (num === 0) return '0';
            if (Math.abs(num) < 0.000001 || Math.abs(num) > 999999999) {
                return num.toExponential(6);
            }
            // Remove trailing zeros but keep significant digits
            return parseFloat(num.toPrecision(10)).toString();
        }
        
        // Update formula
        function updateFormula() {
            const category = conversions[currentCategory];
            if (category.type === 'temperature') {
                formulaText.textContent = category.getFormula(fromUnit.value, toUnit.value);
            } else {
                const fromFactor = category.units[fromUnit.value].factor;
                const toFactor = category.units[toUnit.value].factor;
                formulaText.textContent = `${category.units[fromUnit.value].name} × ${fromFactor} ÷ ${toFactor} = ${category.units[toUnit.value].name}`;
            }
        }
        
        // Add to history
        function addToHistory() {
            const entry = {
                category: currentCategory,
                fromValue: fromValue.value,
                fromUnit: fromUnit.options[fromUnit.selectedIndex].text,
                toValue: toValue.value,
                toUnit: toUnit.options[toUnit.selectedIndex].text,
                timestamp: new Date().toISOString()
            };
            
            // Avoid duplicates
            const exists = conversionHistory.some(h => 
                h.category === entry.category &&
                h.fromValue === entry.fromValue &&
                h.fromUnit === entry.fromUnit &&
                h.toValue === entry.toValue &&
                h.toUnit === entry.toUnit
            );
            
            if (!exists) {
                conversionHistory.unshift(entry);
                if (conversionHistory.length > 20) {
                    conversionHistory.pop();
                }
                localStorage.setItem('unitConverterHistory', JSON.stringify(conversionHistory));
                updateHistoryUI();
            }
        }
        
        // Update history UI
        function updateHistoryUI() {
            if (conversionHistory.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-sm text-center py-4">尚未進行任何轉換</p>';
                return;
            }
            
            historyList.innerHTML = conversionHistory.map((item, index) => `
                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-darker rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-700 dark:text-gray-300 truncate">${item.fromValue} ${item.fromUnit} = ${item.toValue} ${item.toUnit}</p>
                        <p class="text-xs text-gray-500">${conversions[item.category].name}</p>
                    </div>
                    <button onclick="useHistoryEntry(${index})" class="ml-2 p-2 text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors" aria-label="使用此轉換">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            
            lucide.createIcons();
        }
        
        // Use history entry
        window.useHistoryEntry = function(index) {
            const entry = conversionHistory[index];
            selectCategory(entry.category);
            fromValue.value = entry.fromValue;
            toValue.value = entry.toValue;
            fromUnit.value = Object.keys(conversions[entry.category].units).find(key => 
                conversions[entry.category].units[key].name === entry.fromUnit
            );
            toUnit.value = Object.keys(conversions[entry.category].units).find(key => 
                conversions[entry.category].units[key].name === entry.toUnit
            );
            showToast('已載入歷史轉換');
        };
        
        // Add to favorites
        function addToFavorites() {
            if (!fromValue.value || !toValue.value) {
                showToast('請先進行轉換');
                return;
            }
            
            const entry = {
                category: currentCategory,
                fromUnit: fromUnit.value,
                toUnit: toUnit.value
            };
            
            // Check if already exists
            const exists = favorites.some(f => 
                f.category === entry.category &&
                f.fromUnit === entry.fromUnit &&
                f.toUnit === entry.toUnit
            );
            
            if (!exists) {
                favorites.push(entry);
                localStorage.setItem('unitConverterFavorites', JSON.stringify(favorites));
                updateFavoritesUI();
                showToast('已加入收藏');
            } else {
                showToast('此轉換已在收藏中');
            }
        }
        
        // Update favorites UI
        function updateFavoritesUI() {
            if (favorites.length === 0) {
                favoritesList.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-sm text-center py-4">尚未收藏任何轉換</p>';
                return;
            }
            
            favoritesList.innerHTML = favorites.map((item, index) => {
                const fromUnitName = conversions[item.category].units[item.fromUnit].name;
                const toUnitName = conversions[item.category].units[item.toUnit].name;
                return `
                    <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-darker rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-700 dark:text-gray-300">${fromUnitName} → ${toUnitName}</p>
                            <p class="text-xs text-gray-500">${conversions[item.category].name}</p>
                        </div>
                        <button onclick="useFavorite(${index})" class="ml-2 p-2 text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors" aria-label="使用此收藏">
                            <i data-lucide="play" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }
        
        // Use favorite
        window.useFavorite = function(index) {
            const entry = favorites[index];
            selectCategory(entry.category);
            fromUnit.value = entry.fromUnit;
            toUnit.value = entry.toUnit;
            fromValue.value = '';
            toValue.value = '';
            fromValue.focus();
            showToast('已載入收藏轉換');
        };
        
        // Select category
        function selectCategory(category) {
            currentCategory = category;
            categoryTitle.textContent = conversions[category].name + '轉換';
            
            categoryButtons.forEach(btn => {
                btn.classList.remove('category-active');
                btn.classList.add('bg-gray-100', 'dark:bg-gray-700');
            });
            
            const activeBtn = document.querySelector(`[data-category="${category}"]`);
            activeBtn.classList.add('category-active');
            activeBtn.classList.remove('bg-gray-100', 'dark:bg-gray-700');
            
            populateUnits(category);
        }
        
        // Show toast
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
        
        // Event listeners
        fromValue.addEventListener('input', () => convert('from'));
        
        swapBtn.addEventListener('click', () => {
            const tempValue = fromValue.value;
            const tempUnit = fromUnit.value;
            
            fromValue.value = toValue.value;
            toValue.value = tempValue;
            fromUnit.value = toUnit.value;
            toUnit.value = tempUnit;
            
            updateFormula();
            showToast('已交換建位');
        });
        
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectCategory(btn.dataset.category);
                fromValue.value = '';
                toValue.value = '';
            });
        });
        
        fromUnit.addEventListener('change', () => {
            convert('from');
        });
        
        toUnit.addEventListener('change', () => {
            convert('from');
        });
        
        formulaToggle.addEventListener('click', () => {
            formulaText.classList.toggle('hidden');
            formulaIcon.classList.toggle('rotate-180');
        });
        
        copyBtn.addEventListener('click', async () => {
            if (!toValue.value) {
                showToast('請先進行轉換');
                return;
            }
            try {
                await navigator.clipboard.writeText(toValue.value);
                showToast('結果已複製到剪貼簿');
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請重試');
            }
        });
        
        favoriteBtn.addEventListener('click', addToFavorites);
        
        clearBtn.addEventListener('click', () => {
            fromValue.value = '';
            toValue.value = '';
            showToast('已清空');
        });
        
        clearFavorites.addEventListener('click', () => {
            if (confirm('確定要清空所有收藏嗎？')) {
                favorites = [];
                localStorage.removeItem('unitConverterFavorites');
                updateFavoritesUI();
                showToast('收藏已清空');
            }
        });
        
        clearHistory.addEventListener('click', () => {
            if (confirm('確定要清空所有歷史嗎？')) {
                conversionHistory = [];
                localStorage.removeItem('unitConverterHistory');
                updateHistoryUI();
                showToast('歷史已清空');
            }
        });
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('unitConverterTheme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });
        
        // Initialize
        populateUnits(currentCategory);
        updateHistoryUI();
        updateFavoritesUI();
    </script>
</body>
</html>
