    <script>
        // Initialize icons
        lucide.createIcons();
        
        // DOM Elements
        const patternPreview = document.getElementById('patternPreview');
        const shapeGrid = document.getElementById('shapeGrid');
        const primaryColor = document.getElementById('primaryColor');
        const secondaryColor = document.getElementById('secondaryColor');
        const bgColor = document.getElementById('bgColor');
        const primaryColorHex = document.getElementById('primaryColorHex');
        const secondaryColorHex = document.getElementById('secondaryColorHex');
        const bgColorHex = document.getElementById('bgColorHex');
        const sizeSlider = document.getElementById('sizeSlider');
        const spacingSlider = document.getElementById('spacingSlider');
        const rotationSlider = document.getElementById('rotationSlider');
        const offsetSlider = document.getElementById('offsetSlider');
        const sizeValue = document.getElementById('sizeValue');
        const spacingValue = document.getElementById('spacingValue');
        const rotationValue = document.getElementById('rotationValue');
        const offsetValue = document.getElementById('offsetValue');
        const alternateColors = document.getElementById('alternateColors');
        const randomRotation = document.getElementById('randomRotation');
        const varySizes = document.getElementById('varySizes');
        const exportSvg = document.getElementById('exportSvg');
        const exportPng = document.getElementById('exportPng');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // State
        let currentShape = 'circle';
        let patternSvg = null;
        
        // Load saved theme
        const savedTheme = localStorage.getItem('svgPatternMakerTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Generate pattern SVG
        function generatePattern() {
            const size = parseInt(sizeSlider.value);
            const spacing = parseInt(spacingSlider.value);
            const rotation = parseInt(rotationSlider.value);
            const offset = parseInt(offsetSlider.value);
            const alternate = alternateColors.checked;
            const randRotation = randomRotation.checked;
            const varySize = varySizes.checked;
            
            const primary = primaryColor.value;
            const secondary = secondaryColor.value;
            const bg = bgColor.value;
            
            const cellSize = size + spacing;
            const canvasSize = 512;
            const cols = Math.ceil(canvasSize / cellSize);
            const rows = Math.ceil(canvasSize / cellSize);
            
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvasSize}" height="${canvasSize}" viewBox="0 0 ${canvasSize} ${canvasSize}">`;
            svgContent += `<rect width="${canvasSize}" height="${canvasSize}" fill="${bg}"/>`;
            
            let isAlternate = false;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * cellSize + (Math.random() - 0.5) * offset * 2 + size / 2;
                    const y = row * cellSize + (Math.random() - 0.5) * offset * 2 + size / 2;
                    
                    const currentColor = alternate && isAlternate ? secondary : primary;
                    const currentSize = varySize ? size * (0.5 + Math.random()) : size;
                    const currentRotation = randRotation ? Math.random() * 360 : rotation;
                    
                    let shapeElement = '';
                    const colorAttr = `fill="${currentColor}"`;
                    
                    switch (currentShape) {
                        case 'circle':
                            shapeElement = `<circle cx="${x}" cy="${y}" r="${currentSize / 2}" ${colorAttr}/>`;
                            break;
                        case 'square':
                            shapeElement = `<rect x="${x - currentSize / 2}" y="${y - currentSize / 2}" width="${currentSize}" height="${currentSize}" ${colorAttr}/>`;
                            break;
                        case 'triangle':
                            const h = currentSize * 0.866;
                            shapeElement = `<polygon points="${x},${y - h/2} ${x - currentSize/2},${y + h/2} ${x + currentSize/2},${y + h/2}" ${colorAttr}/>`;
                            break;
                        case 'diamond':
                            shapeElement = `<rect x="${x - currentSize / 2}" y="${y - currentSize / 2}" width="${currentSize}" height="${currentSize}" transform="rotate(45 ${x} ${y})" ${colorAttr}/>`;
                            break;
                        case 'star':
                            const starSize = currentSize / 2;
                            const starPoints = '12,2 15,9 22,9 17,14 20,21 12,17 4,21 7,14 2,9 9,9';
                            shapeElement = `<polygon points="${starPoints}" fill="${currentColor}" transform="translate(${x - 12}, ${y - 12}) scale(${starSize / 10})"/>`;
                            break;
                        case 'hexagon':
                            const hexSize = currentSize / 2;
                            const hexPoints = `0,-${hexSize} ${hexSize * 0.866},-${hexSize / 2} ${hexSize * 0.866},${hexSize / 2} 0,${hexSize} -${hexSize * 0.866},${hexSize / 2} -${hexSize * 0.866},-${hexSize / 2}`;
                            shapeElement = `<polygon points="${hexPoints}" fill="${currentColor}" transform="translate(${x}, ${y}) rotate(${currentRotation})"/>`;
                            break;
                        case 'cross':
                            shapeElement = `<path d="M${x - currentSize/4},${y - currentSize} L${x + currentSize/4},${y - currentSize} L${x + currentSize/4},${y - currentSize/4} L${x + currentSize},${y - currentSize/4} L${x + currentSize},${y + currentSize/4} L${x + currentSize/4},${y + currentSize/4} L${x + currentSize/4},${y + currentSize} L${x - currentSize/4},${y + currentSize} L${x - currentSize/4},${y + currentSize/4} L${x - currentSize},${y + currentSize/4} L${x - currentSize},${y - currentSize/4} L${x - currentSize/4},${y - currentSize/4} Z" fill="${currentColor}" transform="rotate(${currentRotation} ${x} ${y})"/>`;
                            break;
                        case 'heart':
                            const heartSize = currentSize / 2;
                            shapeElement = `<path d="M${x},${y + heartSize/2} C${x - heartSize},${y - heartSize/2} ${x - heartSize},${y - heartSize} ${x},${y - heartSize/4} C${x + heartSize},${y - heartSize} ${x + heartSize},${y - heartSize/2} ${x},${y + heartSize/2} Z" fill="${currentColor}" transform="rotate(${currentRotation} ${x} ${y})"/>`;
                            break;
                    }
                    
                    svgContent += shapeElement;
                    isAlternate = !isAlternate;
                }
            }
            
            svgContent += '</svg>';
            
            patternSvg = svgContent;
            
            // Create blob URL and set as background
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            patternPreview.style.backgroundImage = `url(${url})`;
            patternPreview.style.backgroundColor = bg;
        }
        
        // Export SVG
        function exportAsSvg() {
            if (!patternSvg) {
                showToast('請先生成圖案');
                return;
            }
            
            const blob = new Blob([patternSvg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pattern-${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('SVG 已匯出');
        }
        
        // Export PNG
        function exportAsPng() {
            if (!patternSvg) {
                showToast('請先生成圖案');
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            const blob = new Blob([patternSvg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            img.onload = () => {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const pattern = ctx.createPattern(img, 'repeat');
                ctx.fillStyle = pattern;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const pngUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = `pattern-${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                URL.revokeObjectURL(pngUrl);
                showToast('PNG 已匯出');
            };
            
            img.src = url;
        }
        
        // Randomize settings
        function randomize() {
            const shapes = ['circle', 'square', 'triangle', 'diamond', 'star', 'hexagon', 'cross', 'heart'];
            const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            selectShape(randomShape);
            
            const randomPrimary = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const randomSecondary = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const randomBg = Math.random() > 0.5 ? '#ffffff' : '#f0f0f0';
            
            primaryColor.value = randomPrimary;
            primaryColorHex.value = randomPrimary;
            secondaryColor.value = randomSecondary;
            secondaryColorHex.value = randomSecondary;
            bgColor.value = randomBg;
            bgColorHex.value = randomBg;
            
            sizeSlider.value = Math.floor(Math.random() * 50) + 15;
            spacingSlider.value = Math.floor(Math.random() * 50) + 10;
            rotationSlider.value = Math.floor(Math.random() * 360);
            offsetSlider.value = Math.floor(Math.random() * 30);
            
            alternateColors.checked = Math.random() > 0.5;
            randomRotation.checked = Math.random() > 0.7;
            varySizes.checked = Math.random() > 0.7;
            
            updateDisplayValues();
            generatePattern();
            showToast('已隨機化設定');
        }
        
        // Select shape
        function selectShape(shape) {
            currentShape = shape;
            
            shapeGrid.querySelectorAll('.shape-btn').forEach(btn => {
                if (btn.dataset.shape === shape) {
                    btn.classList.add('active');
                    btn.classList.remove('bg-gray-100', 'dark:bg-gray-700');
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('bg-gray-100', 'dark:bg-gray-700');
                }
            });
            
            generatePattern();
        }
        
        // Update display values
        function updateDisplayValues() {
            sizeValue.textContent = sizeSlider.value + 'px';
            spacingValue.textContent = spacingSlider.value + 'px';
            rotationValue.textContent = rotationSlider.value + '°';
            offsetValue.textContent = offsetSlider.value + 'px';
        }
        
        // Show toast
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
        
        // Event listeners
        shapeGrid.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectShape(btn.dataset.shape);
            });
        });
        
        [primaryColor, primaryColorHex].forEach(el => {
            el.addEventListener('input', (e) => {
                primaryColor.value = e.target.value;
                primaryColorHex.value = e.target.value;
                generatePattern();
            });
        });
        
        [secondaryColor, secondaryColorHex].forEach(el => {
            el.addEventListener('input', (e) => {
                secondaryColor.value = e.target.value;
                secondaryColorHex.value = e.target.value;
                generatePattern();
            });
        });
        
        [bgColor, bgColorHex].forEach(el => {
            el.addEventListener('input', (e) => {
                bgColor.value = e.target.value;
                bgColorHex.value = e.target.value;
                generatePattern();
            });
        });
        
        [sizeSlider, spacingSlider, rotationSlider, offsetSlider].forEach(slider => {
            slider.addEventListener('input', () => {
                updateDisplayValues();
                generatePattern();
            });
        });
        
        [alternateColors, randomRotation, varySizes].forEach(checkbox => {
            checkbox.addEventListener('change', generatePattern);
        });
        
        exportSvg.addEventListener('click', exportAsSvg);
        exportPng.addEventListener('click', exportAsPng);
        randomizeBtn.addEventListener('click', randomize);
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('svgPatternMakerTheme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });
        
        // Initialize
        generatePattern();
        lucide.createIcons();
    </script>
</body>
</html>
