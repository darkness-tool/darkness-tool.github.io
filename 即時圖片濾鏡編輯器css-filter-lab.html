    <script>
        // Initialize icons
        lucide.createIcons();
        
        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const dropZone = document.getElementById('dropZone');
        const placeholder = document.getElementById('placeholder');
        const previewImage = document.getElementById('previewImage');
        const downloadOptions = document.getElementById('downloadOptions');
        const downloadOriginal = document.getElementById('downloadOriginal');
        const downloadFiltered = document.getElementById('downloadFiltered');
        const grayscaleSlider = document.getElementById('grayscaleSlider');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const hueRotateSlider = document.getElementById('hueRotateSlider');
        const invertSlider = document.getElementById('invertSlider');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const saturateSlider = document.getElementById('saturateSlider');
        const blurSlider = document.getElementById('blurSlider');
        const grayscaleValue = document.getElementById('grayscaleValue');
        const sepiaValue = document.getElementById('sepiaValue');
        const hueRotateValue = document.getElementById('hueRotateValue');
        const invertValue = document.getElementById('invertValue');
        const brightnessValue = document.getElementById('brightnessValue');
        const contrastValue = document.getElementById('contrastValue');
        const saturateValue = document.getElementById('saturateValue');
        const blurValue = document.getElementById('blurValue');
        const resetBtn = document.getElementById('resetBtn');
        const presetGrid = document.getElementById('presetGrid');
        const cssCode = document.getElementById('cssCode');
        const copyCss = document.getElementById('copyCss');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // Presets
        const PRESETS = {
            none: { grayscale: 0, sepia: 0, hueRotate: 0, invert: 0, brightness: 100, contrast: 100, saturate: 100, blur: 0 },
            grayscale: { grayscale: 100, sepia: 0, hueRotate: 0, invert: 0, brightness: 100, contrast: 100, saturate: 0, blur: 0 },
            sepia: { grayscale: 0, sepia: 100, hueRotate: 0, invert: 0, brightness: 100, contrast: 100, saturate: 100, blur: 0 },
            invert: { grayscale: 0, sepia: 0, hueRotate: 0, invert: 100, brightness: 100, contrast: 100, saturate: 100, blur: 0 },
            vintage: { grayscale: 50, sepia: 40, hueRotate: 0, invert: 0, brightness: 110, contrast: 90, saturate: 70, blur: 0 },
            cold: { grayscale: 0, sepia: 0, hueRotate: 180, invert: 0, brightness: 100, contrast: 100, saturate: 80, blur: 0 },
            warm: { grayscale: 0, sepia: 20, hueRotate: 0, invert: 0, brightness: 105, contrast: 100, saturate: 120, blur: 0 },
            dramatic: { grayscale: 30, sepia: 10, hueRotate: 0, invert: 0, brightness: 90, contrast: 140, saturate: 110, blur: 0 },
            dreamy: { grayscale: 0, sepia: 0, hueRotate: 300, invert: 0, brightness: 110, contrast: 90, saturate: 90, blur: 1 },
            noir: { grayscale: 100, sepia: 50, hueRotate: 0, invert: 0, brightness: 90, contrast: 130, saturate: 0, blur: 0 }
        };
        
        // State
        let currentImage = null;
        let originalImageData = null;
        
        // Load saved theme
        const savedTheme = localStorage.getItem('cssFilterLabTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Generate CSS filter string
        function generateFilterCSS() {
            const filters = [];
            
            if (parseInt(grayscaleSlider.value) > 0) {
                filters.push(`grayscale(${grayscaleSlider.value}%)`);
            }
            if (parseInt(sepiaSlider.value) > 0) {
                filters.push(`sepia(${sepiaSlider.value}%)`);
            }
            if (parseInt(hueRotateSlider.value) > 0) {
                filters.push(`hue-rotate(${hueRotateSlider.value}deg)`);
            }
            if (parseInt(invertSlider.value) > 0) {
                filters.push(`invert(${invertSlider.value}%)`);
            }
            if (parseInt(brightnessSlider.value) !== 100) {
                filters.push(`brightness(${brightnessSlider.value}%)`);
            }
            if (parseInt(contrastSlider.value) !== 100) {
                filters.push(`contrast(${contrastSlider.value}%)`);
            }
            if (parseInt(saturateSlider.value) !== 100) {
                filters.push(`saturate(${saturateSlider.value}%)`);
            }
            if (parseInt(blurSlider.value) > 0) {
                filters.push(`blur(${blurSlider.value}px)`);
            }
            
            return filters.join(' ');
        }
        
        // Apply filters to image
        function applyFilters() {
            if (!previewImage.src) return;
            
            const filter = generateFilterCSS();
            previewImage.style.filter = filter;
            
            // Update CSS code
            cssCode.textContent = `filter: ${filter};`;
            
            // Update value displays
            grayscaleValue.textContent = grayscaleSlider.value + '%';
            sepiaValue.textContent = sepiaSlider.value + '%';
            hueRotateValue.textContent = hueRotateSlider.value + '°';
            invertValue.textContent = invertSlider.value + '%';
            brightnessValue.textContent = brightnessSlider.value + '%';
            contrastValue.textContent = contrastSlider.value + '%';
            saturateValue.textContent = saturateSlider.value + '%';
            blurValue.textContent = blurSlider.value + 'px';
        }
        
        // Handle file upload
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('請選擇有效的圖片檔案');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                previewImage.src = currentImage;
                previewImage.classList.remove('hidden');
                placeholder.classList.add('hidden');
                downloadOptions.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        
        // Download filtered image
        function downloadFilteredEvent() {
            if (!currentImage) {
                showToast('請先上傳圖片');
                return;
            }
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            img.onload = () => {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                
                ctx.filter = generateFilterCSS();
                ctx.drawImage(img, 0, 0);
                
                const link = document.createElement('a');
                link.download = `filtered-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                showToast('圖片已下載');
            };
            img.src = currentImage;
        }
        
        // Apply preset
        function applyPreset(presetName) {
            const preset = PRESETS[presetName];
            if (!preset) return;
            
            grayscaleSlider.value = preset.grayscale;
            sepiaSlider.value = preset.sepia;
            hueRotateSlider.value = preset.hueRotate;
            invertSlider.value = preset.invert;
            brightnessSlider.value = preset.brightness;
            contrastSlider.value = preset.contrast;
            saturateSlider.value = preset.saturate;
            blurSlider.value = preset.blur;
            
            applyFilters();
            
            // Update active preset
            presetGrid.querySelectorAll('.preset-card').forEach(card => {
                if (card.dataset.preset === presetName) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
            
            showToast('已套用預設');
        }
        
        // Reset all filters
        function resetFilters() {
            applyPreset('none');
            showToast('已重置所有濾鏡');
        }
        
        // Copy CSS
        async function copyToClipboard() {
            const code = cssCode.textContent;
            try {
                await navigator.clipboard.writeText(code);
                showToast('CSS 代碼已複製');
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請重試');
            }
        }
        
        // Show toast
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
        
        // Event listeners
        uploadBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });
        
        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        // Filter sliders
        [grayscaleSlider, sepiaSlider, hueRotateSlider, invertSlider, brightnessSlider, contrastSlider, saturateSlider, blurSlider].forEach(slider => {
            slider.addEventListener('input', applyFilters);
        });
        
        resetBtn.addEventListener('click', resetFilters);
        downloadOriginal.addEventListener('click', () => {
            if (!currentImage) {
                showToast('請先上傳圖片');
                return;
            }
            const link = document.createElement('a');
            link.href = currentImage;
            link.download = `original-${Date.now()}.png`;
            link.click();
            showToast('原始圖片已下載');
        });
        
        downloadFiltered.addEventListener('click', downloadFilteredEvent);
        
        // Presets
        presetGrid.querySelectorAll('.preset-card').forEach(card => {
            card.addEventListener('click', () => {
                applyPreset(card.dataset.preset);
            });
        });
        
        copyCss.addEventListener('click', copyToClipboard);
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('cssFilterLabTheme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });
        
        // Initialize
        lucide.createIcons();
    </script>
</body>
</html>
