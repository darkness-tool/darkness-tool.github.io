    <script>
        // Initialize icons
        lucide.createIcons();
        
        // DOM Elements
        const jsonInput = document.getElementById('jsonInput');
        const formatBtn = document.getElementById('formatBtn');
        const clearBtn = document.getElementById('clearBtn');
        const convertBtn = document.getElementById('convertBtn');
        const loadExampleBtn = document.getElementById('loadExampleBtn');
        const errorDisplay = document.getElementById('errorDisplay');
        const errorMessage = document.getElementById('errorMessage');
        const tableSection = document.getElementById('tableSection');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const rowCount = document.getElementById('rowCount');
        const filteredCount = document.getElementById('filteredCount');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const exportHtmlBtn = document.getElementById('exportHtmlBtn');
        const emptyState = document.getElementById('emptyState');
        const pageSize = document.getElementById('pageSize');
        const prevPage = document.getElementById('prevPage');
        const nextPage = document.getElementById('nextPage');
        const currentPageEl = document.getElementById('currentPage');
        const totalPagesEl = document.getElementById('totalPages');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // Example data
        const EXAMPLE_JSON = `[
  {
    "id": 1,
    "name": "張三",
    "age": 25,
    "email": "zhangsan@example.com",
    "city": "台北",
    "salary": 50000,
    "department": "研發部"
  },
  {
    "id": 2,
    "name": "李四",
    "age": 30,
    "email": "lisi@example.com",
    "city": "高雄",
    "salary": 65000,
    "department": "行銷部"
  },
  {
    "id": 3,
    "name": "王五",
    "age": 28,
    "email": "wangwu@example.com",
    "city": "台中",
    "salary": 55000,
    "department": "研發部"
  },
  {
    "id": 4,
    "name": "趙六",
    "age": 35,
    "email": "zhaoliu@example.com",
    "city": "台北",
    "salary": 75000,
    "department": "管理部"
  },
  {
    "id": 5,
    "name": "錢七",
    "age": 27,
    "email": "qianqi@example.com",
    "city": "新竹",
    "salary": 58000,
    "department": "研發部"
  }
]`;
        
        // State
        let tableData = [];
        let filteredData = [];
        let headers = [];
        let sortColumn = null;
        let sortDirection = 'asc';
        let currentPage = 1;
        let currentPageSize = 10;
        
        // Load saved theme
        const savedTheme = localStorage.getItem('jsonTableViewerTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Format JSON
        function formatJson() {
            const input = jsonInput.value.trim();
            if (!input) return;
            
            try {
                const parsed = JSON.parse(input);
                jsonInput.value = JSON.stringify(parsed, null, 2);
                errorDisplay.classList.add('hidden');
                showToast('JSON 已格式化');
            } catch (e) {
                showError(e.message);
            }
        }
        
        // Parse and convert to table
        function convertToTable() {
            const input = jsonInput.value.trim();
            if (!input) {
                showToast('請輸入 JSON 數據');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                
                // Handle different data structures
                if (Array.isArray(parsed)) {
                    tableData = parsed;
                } else if (typeof parsed === 'object') {
                    // Try to find array in object
                    const arrayKey = Object.keys(parsed).find(key => Array.isArray(parsed[key]));
                    if (arrayKey) {
                        tableData = parsed[arrayKey];
                    } else {
                        // Treat as single object
                        tableData = [parsed];
                    }
                } else {
                    throw new Error('JSON 必須是物件或陣列');
                }
                
                // Extract headers
                headers = new Set();
                tableData.forEach(item => {
                    if (typeof item === 'object' && item !== null) {
                        Object.keys(item).forEach(key => headers.add(key));
                    }
                });
                headers = Array.from(headers);
                
                filteredData = [...tableData];
                sortColumn = null;
                sortDirection = 'asc';
                currentPage = 1;
                
                errorDisplay.classList.add('hidden');
                tableSection.classList.remove('hidden');
                
                renderTable();
                updatePagination();
                
                rowCount.textContent = tableData.length;
                showToast(`成功轉換 ${tableData.length} 筆資料`);
            } catch (e) {
                showError(e.message);
            }
        }
        
        // Show error
        function showError(message) {
            errorMessage.textContent = message;
            errorDisplay.classList.remove('hidden');
        }
        
        // Render table header
        function renderHeader() {
            tableHeader.innerHTML = headers.map(header => `
                <th class="sortable-header px-4 py-3 text-left text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider" data-column="${header}">
                    <div class="flex items-center gap-1">
                        <span>${header}</span>
                        <i data-lucide="${sortColumn === header ? (sortDirection === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down'}" class="sort-icon w-4 h-4 ${sortColumn === header ? 'active' : ''}"></i>
                    </div>
                </th>
            `).join('');
            
            tableHeader.querySelectorAll('.sortable-header').forEach(th => {
                th.addEventListener('click', () => sortTable(th.dataset.column));
            });
            
            lucide.createIcons();
        }
        
        // Render table body
        function renderBody() {
            const searchTerm = searchInput.value.toLowerCase();
            const paginatedData = getPaginatedData();
            
            if (paginatedData.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            tableBody.innerHTML = paginatedData.map((row, index) => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors ${index % 2 === 0 ? 'bg-white dark:bg-dark' : 'bg-gray-50/50 dark:bg-gray-800/50'}">
                    ${headers.map(header => {
                        const value = getCellValue(row, header);
                        const displayValue = formatCellValue(value);
                        return `
                            <td class="px-4 py-3 text-sm text-gray-900 dark:text-gray-100">
                                ${highlightMatch(displayValue, searchTerm)}
                            </td>
                        `;
                    }).join('')}
                </tr>
            `).join('');
        }
        
        // Get cell value (handle nested objects)
        function getCellValue(row, header) {
            const keys = header.split('.');
            let value = row;
            
            for (const key of keys) {
                if (value && typeof value === 'object') {
                    value = value[key];
                } else {
                    return undefined;
                }
            }
            
            return value;
        }
        
        // Format cell value for display
        function formatCellValue(value) {
            if (value === null || value === undefined) return '-';
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }
        
        // Highlight matching text
        function highlightMatch(text, searchTerm) {
            if (!searchTerm) return text;
            
            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[]\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight-match">$1</span>');
        }
        
        // Sort table
        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            
            filteredData.sort((a, b) => {
                const valueA = getCellValue(a, column);
                const valueB = getCellValue(b, column);
                
                if (valueA === valueB) return 0;
                if (valueA == null) return 1;
                if (valueB == null) return -1;
                
                const comparison = valueA < valueB ? -1 : 1;
                return sortDirection === 'asc' ? comparison : -comparison;
            });
            
            renderHeader();
            renderBody();
        }
        
        // Filter data based on search
        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            
            if (!searchTerm) {
                filteredData = [...tableData];
                filteredCount.classList.add('hidden');
            } else {
                filteredData = tableData.filter(row => {
                    return headers.some(header => {
                        const value = getCellValue(row, header);
                        if (value == null) return false;
                        const displayValue = formatCellValue(value);
                        return displayValue.toLowerCase().includes(searchTerm);
                    });
                });
                
                filteredCount.classList.remove('hidden');
                filteredCount.querySelector('span').textContent = filteredData.length;
            }
            
            currentPage = 1;
            updatePagination();
            renderBody();
        }
        
        // Get paginated data
        function getPaginatedData() {
            const start = (currentPage - 1) * currentPageSize;
            const end = start + currentPageSize;
            return filteredData.slice(start, end);
        }
        
        // Update pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / currentPageSize) || 1;
            
            currentPageEl.textContent = currentPage;
            totalPagesEl.textContent = totalPages;
            
            prevPage.disabled = currentPage === 1;
            nextPage.disabled = currentPage === totalPages;
        }
        
        // Export as CSV
        function exportCsv() {
            if (filteredData.length === 0) {
                showToast('沒有資料可匯出');
                return;
            }
            
            const csvContent = [
                headers.join(','),
                ...filteredData.map(row => 
                    headers.map(header => {
                        const value = getCellValue(row, header);
                        const displayValue = formatCellValue(value);
                        return `"${displayValue.replace(/"/g, '""')}"`;
                    }).join(',')
                )
            ].join('\n');
            
            const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `json-table-${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('CSV 已匯出');
        }
        
        // Export as HTML
        function exportHtml() {
            if (filteredData.length === 0) {
                showToast('沒有資料可匯出');
                return;
            }
            
            const htmlContent = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON Table Export</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f5f5f5; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                ${headers.map(header => `<th>${header}</th>`).join('')}
            </tr>
        </thead>
        <tbody>
            ${filteredData.map(row => `
                <tr>
                    ${headers.map(header => {
                        const value = getCellValue(row, header);
                        const displayValue = formatCellValue(value);
                        return `<td>${displayValue}</td>`;
                    }).join('')}
                </tr>
            `).join('')}
        </tbody>
    </table>
</body>
</html>`;
            
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `json-table-${Date.now()}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('HTML 已匯出');
        }
        
        // Load example
        function loadExample() {
            jsonInput.value = EXAMPLE_JSON;
            errorDisplay.classList.add('hidden');
            showToast('範例已載入');
        }
        
        // Clear input
        function clearInput() {
            jsonInput.value = '';
            errorDisplay.classList.add('hidden');
            tableSection.classList.add('hidden');
            showToast('已清空');
        }
        
        // Show toast
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
        
        // Render complete table
        function renderTable() {
            renderHeader();
            renderBody();
        }
        
        // Event listeners
        formatBtn.addEventListener('click', formatJson);
        clearBtn.addEventListener('click', clearInput);
        convertBtn.addEventListener('click', convertToTable);
        loadExampleBtn.addEventListener('click', loadExample);
        searchInput.addEventListener('input', filterData);
        
        exportCsvBtn.addEventListener('click', exportCsv);
        exportHtmlBtn.addEventListener('click', exportHtml);
        
        pageSize.addEventListener('change', (e) => {
            currentPageSize = parseInt(e.target.value);
            currentPage = 1;
            updatePagination();
            renderBody();
        });
        
        prevPage.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updatePagination();
                renderBody();
            }
        });
        
        nextPage.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / currentPageSize);
            if (currentPage < totalPages) {
                currentPage++;
                updatePagination();
                renderBody();
            }
        });
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('jsonTableViewerTheme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });
        
        // Initialize
        lucide.createIcons();
    </script>
</body>
</html>
