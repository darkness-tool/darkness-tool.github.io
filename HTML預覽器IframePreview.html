    <script>
        function renderHTML() {
            const htmlCode = document.getElementById('htmlInput').value;
            const iframe = document.getElementById('previewFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            iframeDoc.open();
            iframeDoc.write(htmlCode);
            iframeDoc.close();
        }
        
        function clearAll() {
            document.getElementById('htmlInput').value = '';
            const iframe = document.getElementById('previewFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write('');
            iframeDoc.close();
        }
        
        function loadSample() {
            const sampleHTML = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>範例頁面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 歡迎使用!</h1>
        <p>這是一個範例 HTML 頁面</p>
        <p>您可以在左側編輯器中修改程式碼，然後點擊「執行預覽」按鈕查看結果。</p>
        <button class="button" onclick="alert('按鈕被點擊了!')">點擊我</button>
    </div>
</body>
</html>`;
            
            document.getElementById('htmlInput').value = sampleHTML;
            renderHTML();
        }
        
        // Auto-render on input (debounced)
        let timeout;
        document.getElementById('htmlInput').addEventListener('input', function() {
            clearTimeout(timeout);
            timeout = setTimeout(renderHTML, 500);
        });
        
        // Load sample on page load
        loadSample();
        
        // Accessibility: Handle keyboard navigation
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
    </script>
</body>
