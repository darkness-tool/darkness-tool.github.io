    <script>
        // Initialize icons
        lucide.createIcons();
        
        // DOM Elements
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const lineCount = document.getElementById('lineCount');
        const saveStatus = document.getElementById('saveStatus');
        const themeToggle = document.getElementById('themeToggle');
        const downloadMd = document.getElementById('downloadMd');
        const copyHtml = document.getElementById('copyHtml');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // Load saved content
        const savedContent = localStorage.getItem('markdownEditorContent');
        if (savedContent) {
            editor.value = savedContent;
        }
        
        // Load saved theme preference
        const savedTheme = localStorage.getItem('markdownEditorTheme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Update preview
        function updatePreview() {
            const markdown = editor.value;
            preview.innerHTML = marked.parse(markdown);
            updateStats();
            saveContent();
        }
        
        // Update statistics
        function updateStats() {
            const text = editor.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const lines = text.split('\n').length;
            
            wordCount.textContent = words;
            charCount.textContent = chars;
            lineCount.textContent = lines;
        }
        
        // Save content to localStorage
        let saveTimeout;
        function saveContent() {
            clearTimeout(saveTimeout);
            saveStatus.textContent = '儲存中...';
            saveStatus.className = 'text-yellow-600 dark:text-yellow-400';
            
            saveTimeout = setTimeout(() => {
                localStorage.setItem('markdownEditorContent', editor.value);
                saveStatus.textContent = '已自動儲存';
                saveStatus.className = 'text-green-600 dark:text-green-400';
            }, 500);
        }
        
        // Show toast notification
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
        
        // Theme toggle
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('markdownEditorTheme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });
        
        // Event listeners for editor
        editor.addEventListener('input', updatePreview);
        
        // Download as MD
        downloadMd.addEventListener('click', () => {
            const blob = new Blob([editor.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Markdown 文件已下載');
        });
        
        // Copy HTML
        copyHtml.addEventListener('click', async () => {
            const html = marked.parse(editor.value);
            try {
                await navigator.clipboard.writeText(html);
                showToast('HTML 已複製到剪貼簿');
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請重試');
            }
        });
        
        // Clear content
        clearBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有內容嗎？此操作無法復原。')) {
                editor.value = '';
                updatePreview();
                showToast('內容已清空');
            }
        });
        
        // Initial render
        updatePreview();
    </script>
